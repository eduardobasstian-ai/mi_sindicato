<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="IMG/mi-sindicato-favicon.png">
<title>Mi Sindicato</title>
<link rel="stylesheet" href="profile-ui.css?v=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #101116; color: #f5f5f7; font: 16px system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; }
  header img { width: 150px; }
  section, form { padding: 22px; margin: 16px 0; background: #191b22; border: 1px solid #343743; border-radius: 16px; }
  h1, h2 { margin: 0 0 12px; }
  h2 { font-size: 19px; color: #ffb51b; }
  p { color: #c5c7d0; }
  a { color: #ffb51b; }
  label { display: grid; gap: 6px; margin: 12px 0; }
  label[hidden] { display: none; }
  .platforms { border: 1px solid #626573; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .platforms label { display: flex; align-items: center; margin: 4px 0; }
  .platforms input { width: auto; accent-color: #ffb51b; }
  dt { font-weight: 700; }
  dd { margin: 0 0 10px; overflow-wrap: anywhere; }
  input, select, textarea, button { font: inherit; border-radius: 8px; padding: 10px; }
  input, select, textarea { width: 100%; background: #101116; color: inherit; border: 1px solid #626573; }
  button { background: #ffb51b; border: 0; color: #101116; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .65; cursor: wait; }
  .logout-form { display: contents; }
  .logout-form[hidden] { display: none; }
  #status { color: #ffcd66; }
  .admin-dashboard { background: radial-gradient(ellipse at top, #242229, #101116 70%); min-height: 100vh; }
  .admin-dashboard main { max-width: none; padding: 0 0 32px; }
  .admin-dashboard header { padding: 8px clamp(14px, 3vw, 40px); border-bottom: 1px solid #303039; gap: 12px; }
  .admin-brand, .admin-session { display: flex; align-items: center; gap: 12px; }
  .admin-brand img { width: 108px; }
  .admin-brand small, .admin-session { color: #bfc2ce; font-size: 12px; }
  .admin-brand strong { display: block; font-size: 14px; }
  .admin-session button, .admin-dashboard nav button { background: #2c261b; color: #ffb51b; border: 1px solid #4b4028; }
  .admin-layout { width: min(1080px, calc(100% - 32px)); margin: 24px auto; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 20px; }
  .admin-dashboard nav { position: sticky; top: 16px; align-self: start; display: grid; gap: 4px; padding: 12px; background: #191b22; border: 1px solid #343743; border-radius: 14px; }
  .admin-dashboard nav .admin-eyebrow { padding: 4px 8px 7px; color: #bfc2ce; }
  .admin-dashboard nav button { display: flex; align-items: center; gap: 9px; text-align: left; font-size: 13px; }
  .admin-nav-icon { width: 16px; flex-shrink: 0; text-align: center; }
  .admin-dashboard nav button:not([aria-current]) { background: transparent; border-color: transparent; color: #f5f5f7; }
  .admin-dashboard nav button:not([aria-current]):hover { background: #22252e; border-color: #343743; }
  .admin-eyebrow { color: #ffb51b; text-transform: uppercase; font-size: 10px; letter-spacing: .15em; font-weight: 800; }
  .admin-intro { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .admin-intro p { margin: 0; font-size: 13px; }
  .admin-intro h1 { margin: 5px 0; font-size: 26px; }
  .admin-metrics, .admin-charts { display: grid; gap: 12px; }
  .admin-metrics { grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 18px; }
  .admin-charts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .admin-card { background: #191b22; border: 1px solid #343743; border-radius: 12px; padding: 14px; }
  .admin-card small { color: #c5c7d0; }
  .admin-card strong { display: block; margin-top: 8px; font-size: 23px; }
  .admin-card h3 { margin: 0 0 10px; font-size: 14px; }
  .admin-chart-body { display: flex; align-items: center; gap: 14px; min-height: 112px; }
  .admin-pie { flex: 0 0 88px; aspect-ratio: 1; border-radius: 50%; }
  .admin-legend { margin: 0; padding: 0; list-style: none; font-size: 12px; overflow-wrap: anywhere; }
  .admin-legend li { margin: 4px 0; }
  .admin-dashboard #status { width: min(1080px, calc(100% - 32px)); margin: 12px auto; }
  .admin-dashboard .union-switcher { width: min(1080px, calc(100% - 32px)); margin: 16px auto; }
  .directory-toolbar { display: flex; align-items: start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .directory-toolbar h2 { color: #f5f5f7; margin-bottom: 6px; }
  .directory-toolbar p { margin: 0; font-size: 13px; }
  .directory-toolbar input { width: min(100%, 270px); }
  .directory-scroll { overflow-x: auto; margin-top: 18px; }
  .directory-scroll table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
  .directory-scroll th, .directory-scroll td { border-bottom: 1px solid #343743; padding: 12px 10px; }
  .directory-scroll th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #bfc2ce; }
  .directory-scroll td small { display: block; margin-top: 4px; color: #bfc2ce; }
  .directory-badge { display: inline-block; border-radius: 12px; padding: 4px 8px; background: #2c261b; color: #ffb51b; }
  .member-actions { display: flex; gap: 6px; }
  .member-secondary { background: #22252e; color: #f5f5f7; border: 1px solid #343743; }
  .member-danger { background: #38242a; color: #ffc4c7; border: 1px solid #70434b; }
  .member-active { display: flex; align-items: center; grid-column: 1 / -1; }
  .member-active input { width: auto; accent-color: #ffb51b; }
  .member-dialog { width: min(620px, calc(100% - 28px)); max-height: 92vh; padding: 0; border: 1px solid #343743; border-radius: 18px; background: #191b22; color: #f5f5f7; }
  .member-dialog::backdrop { background: #08090bd9; backdrop-filter: blur(3px); }
  .member-dialog form { position: relative; margin: 0; border: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
  .member-dialog label { margin: 0; }
  .member-dialog h2, .member-dialog fieldset, .member-dialog [role="status"], .member-dialog label:first-of-type { grid-column: 1 / -1; }
  .member-dialog h2 { color: inherit; padding: 5px 44px 15px 0; border-bottom: 1px solid #343743; }
  .member-dialog [role="status"] { margin: 0; color: #ffcd66; }
  .member-dialog [role="status"]:empty { display: none; }
  .member-dialog-close { position: absolute; top: 14px; right: 18px; background: #22252e; color: #f5f5f7; border: 1px solid #343743; }
  @media (max-width: 760px) {
    .admin-layout { grid-template-columns: 1fr; }
    .admin-dashboard nav { position: static; display: flex; flex-wrap: wrap; }
    .admin-dashboard nav .admin-eyebrow { flex-basis: 100%; }
    .admin-metrics { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
  }
  @media (max-width: 520px) {
    .member-dialog form { grid-template-columns: 1fr; }
    .admin-charts { grid-template-columns: 1fr; }
    .admin-session span { display: none; }
    .admin-intro { align-items: start; flex-direction: column; }
  }
</style>
<main>
  <header>
    <img src="IMG/mi-sindicato-header.png" alt="Mi Sindicato">
    <form id="logout" class="logout-form" method="post" action="/api/logout" hidden>
      <button type="submit">Cerrar sesión</button>
    </form>
  </header>
  <div id="panel"></div>
  <p id="status" role="status"></p>
  <section id="file-notice" hidden>
    <h2>Abre Mi Sindicato desde el servidor</h2>
    <p>Inicia sesión en el <a href="http://127.0.0.1:3317/">portal local</a> con tu cuenta de presidente. El portal abrirá tu panel.</p>
  </section>
</main>
<script src="cloud-portal.js?v=20261122-rapido"></script>
<script src="profile-ui.js?v=20261122-rapido"></script>
<script>
  if (window.parent !== window && window.parent.LocalDemo) {
    document.querySelector('header img').src = 'IMG/mi-sindicato-header.png';
    const note = document.createElement('p');
    note.textContent = 'Pruebas locales · Datos ficticios guardados en este navegador';
    document.querySelector('main').prepend(note);
    const script = document.createElement('script');
    script.src = 'sindicato.js?v=20261122-rapido';
    document.body.append(script);
  } else if (location.protocol === 'file:') {
    document.querySelector('header img').src = 'IMG/mi-sindicato-header.png';
    location.replace('index.html#panel');
  } else {
    const script = document.createElement('script');
    script.src = 'sindicato.js?v=20261122-rapido';
    document.body.append(script);
  }
</script>
</html>
